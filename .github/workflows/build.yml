name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run core tests
        run: swift test

      - name: Build the Xcode project (unsigned)
        run: |
          xcodebuild build \
            -project Dedupe.xcodeproj \
            -scheme Dedupe \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
