name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run tests
        run: swift test

      - name: Build Dedupe.app
        run: ./scripts/build-app.sh

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Dedupe-app
          path: build/Dedupe.zip
          if-no-files-found: error
